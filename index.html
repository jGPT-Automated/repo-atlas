<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Jesse — Full-Stack AI Builder</title>
<meta name="description" content="Scroll to fly through the world of Jesse's builds.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/design-system.css">
<link rel="stylesheet" href="shared/nav.css">
<style>
/* ============================================
   SCROLL-WORLD — Scroll-scrubbed fly-through
   Canvas scenes driven by scroll position
   ============================================ */

html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text-primary);
  font-family: var(--font-sans);
  overflow-x: hidden;
}

/* The scroll spacer — sets total scrollable height */
#scroll-track {
  width: 1px;
  position: relative;
  z-index: -1;
}

/* Fixed canvas stage */
#stage {
  position: fixed;
  top: 0; left: 0;
  width: 100vw;
  height: 100vh;
  z-index: 0;
  pointer-events: none;
}

#stage canvas {
  width: 100%;
  height: 100%;
  display: block;
}

/* Copy layer — text overlays */
#copy-layer {
  position: fixed;
  top: 0; left: 0;
  width: 100vw;
  height: 100vh;
  z-index: 2;
  pointer-events: none;
  display: flex;
  align-items: center;
  justify-content: center;
}

.copy-card {
  position: absolute;
  max-width: 560px;
  padding: 0 32px;
  opacity: 0;
  transform: translateY(30px);
  transition: opacity 0.4s ease, transform 0.4s ease;
  pointer-events: auto;
}
.copy-card.visible {
  opacity: 1;
  transform: translateY(0);
}

.copy-card .eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  margin-bottom: 16px;
  padding: 5px 12px;
  border-radius: 4px;
  border: 1px solid;
}
.copy-card .num {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 0.1em;
  margin-bottom: 8px;
}
.copy-card h2 {
  font-size: clamp(32px, 4vw, 52px);
  font-weight: 600;
  line-height: 1.05;
  letter-spacing: -0.04em;
  margin-bottom: 16px;
}
.copy-card p {
  font-size: 15px;
  color: var(--text-secondary);
  line-height: 1.6;
  margin-bottom: 24px;
  max-width: 440px;
}
.copy-card .stack {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 24px;
}
.copy-card .stack span {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-muted);
  border: 1px solid var(--border);
  padding: 4px 10px;
  border-radius: 3px;
}
.copy-card .links {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.copy-card .links a {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-secondary);
  text-decoration: none;
  padding: 8px 16px;
  border: 1px solid var(--border);
  border-radius: 5px;
  transition: all 0.15s;
}
.copy-card .links a:hover {
  color: var(--text-primary);
  border-color: #333;
  transform: translateY(-1px);
}
.copy-card .links a.primary {
  color: var(--bg);
  background: var(--text-primary);
  border-color: var(--text-primary);
}

/* Top bar */
#topbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 32px;
  pointer-events: auto;
}
#topbar .brand {
  font-weight: 600;
  font-size: 14px;
  letter-spacing: -0.02em;
  text-decoration: none;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 8px;
}
#topbar .brand .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);
  animation: pulse-dot 2s ease-in-out infinite;
}
#topbar .nav-links {
  display: flex;
  gap: 24px;
}
#topbar .nav-links a {
  font-size: 13px;
  color: var(--text-secondary);
  text-decoration: none;
  transition: color 0.15s;
}
#topbar .nav-links a:hover { color: var(--text-primary); }

/* Scroll hint */
#scroll-hint {
  position: fixed;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 5;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-muted);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  opacity: 1;
  transition: opacity 0.4s;
  pointer-events: none;
}
#scroll-hint.hidden { opacity: 0; }
#scroll-hint .arrow {
  width: 1px;
  height: 24px;
  background: linear-gradient(to bottom, var(--text-muted), transparent);
  animation: hint-pulse 1.8s ease-in-out infinite;
}
@keyframes hint-pulse {
  0%, 100% { opacity: 0.3; transform: scaleY(1); }
  50% { opacity: 1; transform: scaleY(1.3); }
}

/* Route dots — right side navigation */
#route-dots {
  position: fixed;
  right: 24px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 5;
  display: flex;
  flex-direction: column;
  gap: 12px;
  pointer-events: auto;
}
.route-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: transparent;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
}
.route-dot.active {
  background: var(--accent);
  border-color: var(--accent);
  box-shadow: 0 0 8px rgba(16,185,129,0.4);
}
.route-dot:hover {
  border-color: var(--text-secondary);
}
.route-dot .label {
  position: absolute;
  right: 16px;
  top: 50%;
  transform: translateY(-50%);
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--text-muted);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.2s;
  pointer-events: none;
}
.route-dot:hover .label { opacity: 1; }

/* Scrollbar progress */
#scroll-progress {
  position: fixed;
  top: 0; left: 0;
  height: 2px;
  width: 0%;
  background: var(--accent);
  z-index: 20;
  transition: width 0.1s linear;
}

/* Mobile */
@media (max-width: 768px) {
  #topbar { padding: 16px 20px; }
  #topbar .nav-links { display: none; }
  .copy-card { padding: 0 24px; }
  .copy-card h2 { font-size: 28px; }
  .copy-card p { font-size: 14px; }
  #route-dots { right: 12px; gap: 8px; }
  .route-dot .label { display: none; }
}
</style>
</head>
<body>

<!-- Scroll progress bar -->
<div id="scroll-progress"></div>

<!-- Top bar -->
<div id="topbar">
  <a href="#" class="brand"><span class="dot"></span>Jesse Harrick</a>
  <div class="nav-links">
    <a href="roadmap.html">Roadmap</a>
    <a href="portal.html">Portal</a>
    <a href="https://github.com/jGPT-Automated/repo-atlas">Atlas</a>
  </div>
</div>

<!-- Fixed canvas stage -->
<div id="stage">
  <canvas id="canvas"></canvas>
</div>

<!-- Copy layer with project overlays -->
<div id="copy-layer"></div>

<!-- Route dots -->
<div id="route-dots"></div>

<!-- Scroll hint -->
<div id="scroll-hint">
  <span>scroll to fly through</span>
  <div class="arrow"></div>
</div>

<!-- Scroll spacer — sets the scrollable height -->
<div id="scroll-track"></div>

<script>
// ============================================
// SCROLL-WORLD ENGINE — Canvas scroll-scrubbed fly-through
// Adapted from scroll-world scrub concept, using canvas
// instead of video clips. Each scene = 2x viewport scroll.
// ============================================

(function() {
  'use strict';

  // --- CONFIG ---
  const SCENE_SCROLL = 2.0;  // viewport heights per scene
  const TRANSITION = 0.15;    // fraction of scene for crossfade

  // --- SCENES ---
  // Each scene has: id, label, accent color, and a render function(ctx, progress, w, h)
  // Progress goes 0→1 within the scene's scroll range.
  // The render function draws the scene-specific visual.

  const ACCENTS = {
    localcheck: '#f97316',
    teaims: '#818cf8',
    omnivital: '#10b981',
    alphaGauge: '#0ea5e9',
    generativejesse: '#10b981',
    propersona: '#10b981',
    careerops: '#f59e0b',
    agentjess: '#a78bfa',
    purpdex: '#0ea5e9',
    axonai: '#f59e0b',
    stocktok: '#0ea5e9',
    danielscuts: '#a78bfa',
  };

  const SCENES = [
    {
      id: 'hero',
      label: 'Intro',
      accent: '#10b981',
      copy: {
        eyebrow: 'Full-Stack AI Builder',
        title: 'Jesse builds\nthings that ship.',
        body: '70+ repos across AI, fintech, health tech, and sports. Scroll to fly through the portfolio.',
      },
      render: renderHero,
    },
    {
      id: 'localcheck',
      label: 'LocalCheck',
      accent: ACCENTS.localcheck,
      copy: {
        eyebrow: 'Sports · Mobile',
        title: 'LocalCheck',
        body: 'Street sports app — find active courts, check in, play, rank up. 5,734 courts mapped, 25+ TestFlight users, shipping.',
        stack: ['Expo SDK 54', 'React Native', 'Supabase', 'Mapbox', 'ELO'],
        links: [
          { label: 'GitHub', href: 'https://github.com/agenticjess-star/LocalCheck_Expo', primary: true },
          { label: 'Live', href: 'https://localcheck.lovable.app' },
          { label: 'Details', href: 'projects/localcheck.html' },
        ],
      },
      render: renderLocalCheck,
    },
    {
      id: 'teaims',
      label: 'TEAIMS',
      accent: ACCENTS.teaims,
      copy: {
        eyebrow: 'AI / Agents',
        title: 'TEAIMS',
        body: 'Multi-agent AI operating system — 9 specialized agents with adversarial debates, HITL judgement, and persistent context.',
        stack: ['React 18', 'Vite', 'shadcn/ui', 'Framer Motion', 'LangGraph'],
        links: [
          { label: 'GitHub', href: 'https://github.com/GenJess/TEAIMS', primary: true },
          { label: 'Details', href: 'projects/teaims.html' },
        ],
      },
      render: renderTEAIMS,
    },
    {
      id: 'omnivital',
      label: 'OmniVital',
      accent: ACCENTS.omnivital,
      copy: {
        eyebrow: 'Health Tech',
        title: 'OmniVital',
        body: 'AI wellness platform — voice-first consultant, 6 precision formulas, biometric tracking, privacy-first community. 11K+ lines, live.',
        stack: ['React 18', 'FastAPI', 'Supabase', 'GPT-4.1', 'ElevenLabs'],
        links: [
          { label: 'GitHub', href: 'https://github.com/GenJess/omnivital-v3', primary: true },
          { label: 'Live', href: 'https://omnivital.lovable.app' },
          { label: 'Details', href: 'projects/omnivital.html' },
        ],
      },
      render: renderOmniVital,
    },
    {
      id: 'alpha-gauge',
      label: 'Alpha-Gauge',
      accent: ACCENTS.alphaGauge,
      copy: {
        eyebrow: 'Fintech',
        title: 'Alpha-Gauge',
        body: 'Real-time Polymarket trading dashboard — particle filter probability models, Monte Carlo analysis, governance audit trail.',
        stack: ['React 18', 'Vite', 'TypeScript', 'Polymarket API', 'WebSocket'],
        links: [
          { label: 'GitHub', href: 'https://github.com/agenticjess-star/alpha-gauge', primary: true },
          { label: 'Details', href: 'projects/alpha-gauge.html' },
        ],
      },
      render: renderAlphaGauge,
    },
    {
      id: 'generativejesse',
      label: 'GenerativeJesse',
      accent: ACCENTS.generativejesse,
      copy: {
        eyebrow: 'Portfolio',
        title: 'GenerativeJesse',
        body: 'Live portfolio — Spline 3D ocean landing, interactive navigation, crypto dashboard. Production at generativejesse.com.',
        stack: ['Vite', 'React', 'Spline 3D', 'shadcn/ui', 'Vercel'],
        links: [
          { label: 'GitHub', href: 'https://github.com/GenJess/GenerativeJesse-LIVE', primary: true },
          { label: 'Live', href: 'https://generativejesse.com' },
          { label: 'Details', href: 'projects/generativejesse.html' },
        ],
      },
      render: renderGenerativeJesse,
    },
    {
      id: 'propersona',
      label: 'ProPersona',
      accent: ACCENTS.propersona,
      copy: {
        eyebrow: 'AI / Agents',
        title: 'ProPersona',
        body: 'Live at pro-persona.lovable.app — AI-generated personas for branding, UX research, and go-to-market.',
        stack: ['React', 'OpenAI', 'Lovable'],
        links: [
          { label: 'Live', href: 'https://pro-persona.lovable.app', primary: true },
        ],
      },
      render: renderGeneric,
    },
    {
      id: 'careerops',
      label: 'CareerOps',
      accent: ACCENTS.careerops,
      copy: {
        eyebrow: 'AI / Agents',
        title: 'CareerOps',
        body: 'DevOps principles applied to job hunting — automated pipeline for applications, follow-ups, and tracking.',
        stack: ['Python', 'CLI', 'Automation', 'LLM'],
        links: [
          { label: 'GitHub', href: 'https://github.com/GenJess/career-ops', primary: true },
        ],
      },
      render: renderGeneric,
    },
    {
      id: 'agentjess',
      label: 'AgentJess',
      accent: ACCENTS.agentjess,
      copy: {
        eyebrow: 'Portfolio',
        title: 'AgentJess',
        body: 'Voice-navigated portfolio with Three.js particle orb, ElevenLabs orb, and client-side navigation tools.',
        stack: ['React', 'Three.js', 'ElevenLabs', 'Gemini'],
        links: [
          { label: 'GitHub', href: 'https://github.com/GenJess/agentjess-portfolio', primary: true },
        ],
      },
      render: renderGeneric,
    },
    {
      id: 'finale',
      label: 'Contact',
      accent: '#10b981',
      copy: {
        eyebrow: 'Let\'s build',
        title: 'Something real.',
        body: 'Open to full-time roles, contract work, and founding engineer opportunities. AI, health tech, or fintech — let\'s talk.',
        links: [
          { label: 'Email', href: 'mailto:Generative.jesse@gmail.com', primary: true },
          { label: 'GitHub', href: 'https://github.com/GenJess' },
          { label: 'Portfolio', href: 'https://generativejesse.com' },
        ],
      },
      render: renderFinale,
    },
  ];

  // --- SETUP ---
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const copyLayer = document.getElementById('copy-layer');
  const routeDots = document.getElementById('route-dots');
  const scrollTrack = document.getElementById('scroll-track');
  const scrollHint = document.getElementById('scroll-hint');
  const scrollProgress = document.getElementById('scroll-progress');

  let W = 0, H = 0, dpr = 1;
  let scrollY = 0;
  let maxScroll = 0;
  let activeScene = 0;
  let time = 0;

  // Particles for hero/transition
  const particles = [];
  const PARTICLE_COUNT = 120;

  function initParticles() {
    particles.length = 0;
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(Math.random() * 2 - 1);
      const r = 0.35 + Math.random() * 0.15;
      particles.push({
        x: r * Math.sin(phi) * Math.cos(theta),
        y: r * Math.sin(phi) * Math.sin(theta),
        z: r * Math.cos(phi),
        size: Math.random() * 1.5 + 0.3,
      });
    }
  }

  // --- RESIZE ---
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Set scroll track height
    const totalScenes = SCENES.length;
    const totalScrollH = totalScenes * SCENE_SCROLL * H;
    scrollTrack.style.height = totalScrollH + 'px';
    maxScroll = totalScrollH - H;
  }

  // --- BUILD COPY CARDS ---
  const copyCards = [];
  SCENES.forEach((scene, i) => {
    const card = document.createElement('div');
    card.className = 'copy-card';
    card.style.setProperty('--accent', scene.accent);

    const eyebrowColor = scene.accent;
    const num = String(i).padStart(2, '0');
    const totalNum = String(SCENES.length - 1).padStart(2, '0');

    let html = `<div class="num">${num} / ${totalNum}</div>`;
    html += `<span class="eyebrow" style="color:${eyebrowColor};border-color:${eyebrowColor}33;background:${eyebrowColor}11;">${scene.copy.eyebrow}</span>`;
    html += `<h2>${scene.copy.title.replace(/\n/g, '<br>')}</h2>`;
    if (scene.copy.body) html += `<p>${scene.copy.body}</p>`;
    if (scene.copy.stack) {
      html += `<div class="stack">${scene.copy.stack.map(s => `<span>${s}</span>`).join('')}</div>`;
    }
    if (scene.copy.links) {
      html += `<div class="links">${scene.copy.links.map(l =>
        `<a href="${l.href}" target="_blank" class="${l.primary ? 'primary' : ''}">${l.label}</a>`
      ).join('')}</div>`;
    }
    card.innerHTML = html;
    copyLayer.appendChild(card);
    copyCards.push(card);
  });

  // --- BUILD ROUTE DOTS ---
  SCENES.forEach((scene, i) => {
    const dot = document.createElement('button');
    dot.className = 'route-dot';
    dot.innerHTML = `<span class="label">${scene.label}</span>`;
    dot.addEventListener('click', () => {
      const targetY = i * SCENE_SCROLL * H;
      window.scrollTo({ top: targetY, behavior: 'smooth' });
    });
    routeDots.appendChild(dot);
  });
  const dotElements = routeDots.querySelectorAll('.route-dot');

  // --- SCROLL MATH ---
  function getSceneProgress() {
    const sceneHeight = SCENE_SCROLL * H;
    const currentScene = Math.min(Math.floor(scrollY / sceneHeight), SCENES.length - 1);
    const sceneStart = currentScene * sceneHeight;
    const progress = (scrollY - sceneStart) / sceneHeight;
    return { scene: currentScene, progress: Math.max(0, Math.min(1, progress)) };
  }

  // --- RENDER LOOP ---
  function render() {
    time += 0.016;
    ctx.clearRect(0, 0, W, H);

    // Background
    ctx.fillStyle = '#080808';
    ctx.fillRect(0, 0, W, H);

    const { scene, progress } = getSceneProgress();
    activeScene = scene;

    // Draw current scene
    const currentAccent = SCENES[scene].accent;
    SCENES[scene].render(ctx, progress, W, H, time, currentAccent);

    // Crossfade with next scene near the end
    if (progress > 1 - TRANSITION && scene < SCENES.length - 1) {
      const fadeProgress = (progress - (1 - TRANSITION)) / TRANSITION;
      ctx.globalAlpha = fadeProgress;
      const nextAccent = SCENES[scene + 1].accent;
      SCENES[scene + 1].render(ctx, 0, W, H, time, nextAccent);
      ctx.globalAlpha = 1;
    }

    // Update copy cards
    copyCards.forEach((card, i) => {
      const sceneStart = i * SCENE_SCROLL * H;
      const sceneMid = sceneStart + SCENE_SCROLL * H * 0.4;
      const sceneEnd = sceneStart + SCENE_SCROLL * H;
      const dist = Math.abs(scrollY - sceneMid);
      const visibleRange = SCENE_SCROLL * H * 0.35;
      if (dist < visibleRange) {
        card.classList.add('visible');
      } else {
        card.classList.remove('visible');
      }
    });

    // Update route dots
    dotElements.forEach((dot, i) => {
      dot.classList.toggle('active', i === scene);
    });

    // Scroll progress bar
    const totalProgress = maxScroll > 0 ? scrollY / maxScroll : 0;
    scrollProgress.style.width = (totalProgress * 100) + '%';

    // Hide scroll hint after first scroll
    if (scrollY > 50) scrollHint.classList.add('hidden');
    else scrollHint.classList.remove('hidden');

    requestAnimationFrame(render);
  }

  // --- SCENE RENDERERS ---

  function renderHero(ctx, p, w, h, t, accent) {
    // Particle sphere — "fly through" intro
    const cx = w / 2, cy = h / 2;
    const baseR = Math.min(w, h) * 0.28;
    const scale = 1 + p * 1.5;  // sphere grows as you scroll
    const opacity = Math.max(0, 1 - p * 1.2);

    // Background gradient
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, w * 0.6);
    grad.addColorStop(0, 'rgba(16,185,129,0.04)');
    grad.addColorStop(1, 'rgba(8,8,8,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    ctx.save();
    ctx.translate(cx, cy);
    ctx.globalAlpha = opacity;

    const angle = t * 0.15;
    const proj = particles.map(pt => {
      let x = pt.x * Math.cos(angle) - pt.z * Math.sin(angle);
      let z = pt.x * Math.sin(angle) + pt.z * Math.cos(angle);
      let y = pt.y;
      const fov = 3;
      const s = fov / (fov + z);
      return {
        sx: x * baseR * scale * s,
        sy: y * baseR * scale * s,
        s, z: z * scale,
      };
    }).sort((a, b) => a.z - b.z);

    // Connections
    ctx.lineWidth = 0.5;
    for (let i = 0; i < proj.length; i++) {
      for (let j = i + 1; j < proj.length; j++) {
        const dx = proj[i].sx - proj[j].sx;
        const dy = proj[i].sy - proj[j].sy;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d < 60) {
          ctx.strokeStyle = `rgba(16,185,129,${(1 - d / 60) * 0.12 * opacity})`;
          ctx.beginPath();
          ctx.moveTo(proj[i].sx, proj[i].sy);
          ctx.lineTo(proj[j].sx, proj[j].sy);
          ctx.stroke();
        }
      }
    }

    // Particles
    proj.forEach(pt => {
      const a = Math.max(0.08, Math.min(0.7, (pt.z + 1) / 2 * opacity));
      ctx.fillStyle = `rgba(16,185,129,${a})`;
      ctx.beginPath();
      ctx.arc(pt.sx, pt.sy, pt.s * 1.5, 0, Math.PI * 2);
      ctx.fill();
    });

    ctx.restore();
  }

  function renderLocalCheck(ctx, p, w, h, t, accent) {
    const cx = w / 2, cy = h / 2;
    const scale = 0.5 + p * 0.8;

    // Court grid
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(scale, scale);
    ctx.globalAlpha = Math.min(1, p * 2);

    const gridSize = 4;
    const cellSize = 40;
    const totalSize = gridSize * cellSize;
    const offset = -totalSize / 2;

    for (let i = 0; i < gridSize; i++) {
      for (let j = 0; j < gridSize; j++) {
        const x = offset + i * cellSize;
        const y = offset + j * cellSize;
        const isActive = (i + j + Math.floor(t * 0.5)) % 3 === 0;

        ctx.strokeStyle = isActive ? accent : '#28282f';
        ctx.lineWidth = 1;
        ctx.strokeRect(x, y, cellSize - 2, cellSize - 2);

        if (isActive) {
          ctx.fillStyle = accent + '15';
          ctx.fillRect(x, y, cellSize - 2, cellSize - 2);
          // Pulse dot
          const pulse = 0.5 + Math.sin(t * 2 + i + j) * 0.5;
          ctx.fillStyle = accent;
          ctx.beginPath();
          ctx.arc(x + cellSize/2, y + cellSize/2, 3 * pulse, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    // ELO display
    ctx.globalAlpha = Math.min(1, p * 1.5);
    ctx.fillStyle = '#f2f2f6';
    ctx.font = '700 48px Geist Mono, monospace';
    ctx.textAlign = 'center';
    ctx.fillText('1247', 0, -totalSize/2 - 30);
    ctx.fillStyle = '#72728a';
    ctx.font = '500 10px Geist Mono, monospace';
    ctx.fillText('ELO RATING', 0, -totalSize/2 - 12);

    ctx.restore();
  }

  function renderTEAIMS(ctx, p, w, h, t, accent) {
    const cx = w / 2, cy = h / 2;
    const scale = 0.6 + p * 0.5;
    const opacity = Math.min(1, p * 2);

    ctx.save();
    ctx.translate(cx, cy);
    ctx.globalAlpha = opacity;

    // Orbit rings
    const rings = [140, 100, 60];
    rings.forEach((r, i) => {
      ctx.strokeStyle = `rgba(99,102,241,${0.06 + i * 0.02})`;
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.arc(0, 0, r * scale, 0, Math.PI * 2);
      ctx.stroke();
    });
    ctx.setLineDash([]);

    // Core
    ctx.fillStyle = 'rgba(99,102,241,0.08)';
    ctx.beginPath();
    ctx.arc(0, 0, 30 * scale, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(99,102,241,0.3)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = '#818cf8';
    ctx.font = '500 10px Geist Mono, monospace';
    ctx.textAlign = 'center';
    ctx.fillText('HITL', 0, 4);

    // Agent nodes
    const agents = ['IDEA', 'ARCH', 'DESIGN', 'SEC', 'GROW', 'LEGAL'];
    const angle = t * 0.1;
    agents.forEach((label, i) => {
      const a = (i / agents.length) * Math.PI * 2 + angle;
      const r = 140 * scale;
      const x = Math.cos(a) * r;
      const y = Math.sin(a) * r;

      ctx.fillStyle = '#111';
      ctx.strokeStyle = '#1f1f1f';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(x, y, 18, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Connection to core
      ctx.strokeStyle = `rgba(99,102,241,${0.08})`;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(x, y);
      ctx.stroke();

      ctx.fillStyle = '#444';
      ctx.font = '500 7px Geist Mono, monospace';
      ctx.textAlign = 'center';
      ctx.fillText(label, x, y + 2);
    });

    ctx.restore();
  }

  function renderOmniVital(ctx, p, w, h, t, accent) {
    const cx = w / 2, cy = h / 2;
    const scale = 0.6 + p * 0.5;
    const opacity = Math.min(1, p * 2);

    ctx.save();
    ctx.translate(cx, cy);
    ctx.globalAlpha = opacity;

    // Vitality rings
    const rings = [
      { r: 100, color: '#10b981', progress: 0.75 + Math.sin(t * 0.3) * 0.05 },
      { r: 75, color: '#34d399', progress: 0.60 + Math.sin(t * 0.4) * 0.05 },
      { r: 50, color: '#6ee7b7', progress: 0.45 + Math.sin(t * 0.5) * 0.05 },
    ];

    rings.forEach(ring => {
      const r = ring.r * scale;
      // Background ring
      ctx.strokeStyle = 'rgba(16,185,129,0.06)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.stroke();

      // Progress arc
      ctx.strokeStyle = ring.color;
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(0, 0, r, -Math.PI/2, -Math.PI/2 + ring.progress * Math.PI * 2);
      ctx.stroke();
    });

    // Center value
    ctx.fillStyle = '#34d399';
    ctx.font = '700 28px Geist Mono, monospace';
    ctx.textAlign = 'center';
    ctx.fillText('92', 0, 8);
    ctx.fillStyle = '#444';
    ctx.font = '500 9px Geist Mono, monospace';
    ctx.fillText('VITALITY', 0, 24);

    ctx.restore();
  }

  function renderAlphaGauge(ctx, p, w, h, t, accent) {
    const cx = w / 2, cy = h / 2;
    const opacity = Math.min(1, p * 2);
    const scale = 0.7 + p * 0.4;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.globalAlpha = opacity;

    // Price bars
    const bars = [
      { label: 'BTC', up: true, fill: 0.68, val: '$62.4k' },
      { label: 'ETH', up: false, fill: 0.54, val: '$3.1k' },
      { label: 'SOL', up: true, fill: 0.71, val: '$142' },
      { label: '5m',  up: true, fill: 0.58, val: 'UP' },
      { label: '15m', up: false, fill: 0.47, val: 'DN' },
    ];

    const barW = 120 * scale;
    const barH = 6;
    const spacing = 20;
    const totalH = bars.length * spacing;
    const startY = -totalH / 2;

    bars.forEach((bar, i) => {
      const y = startY + i * spacing;
      const animFill = bar.fill + Math.sin(t * 0.5 + i) * 0.03;

      // Label
      ctx.fillStyle = '#444';
      ctx.font = '500 10px Geist Mono, monospace';
      ctx.textAlign = 'left';
      ctx.fillText(bar.label, -barW/2 - 36, y + 4);

      // Track
      ctx.fillStyle = '#1f1f1f';
      ctx.fillRect(-barW/2, y - barH/2, barW, barH);

      // Fill
      const fillW = barW * animFill;
      ctx.fillStyle = bar.up ? '#10b981' : '#f43f5e';
      ctx.fillRect(-barW/2, y - barH/2, fillW, barH);

      // Value
      ctx.fillStyle = bar.up ? '#34d399' : '#f43f5e';
      ctx.font = '500 9px Geist Mono, monospace';
      ctx.textAlign = 'left';
      ctx.fillText(bar.val, barW/2 + 8, y + 4);
    });

    ctx.restore();
  }

  function renderGenerativeJesse(ctx, p, w, h, t, accent) {
    const cx = w / 2, cy = h / 2;
    const opacity = Math.min(1, p * 2);

    ctx.save();
    ctx.translate(cx, cy);
    ctx.globalAlpha = opacity;

    // Expanding wave rings
    const rings = 5;
    for (let i = 0; i < rings; i++) {
      const phase = (t * 0.4 + i / rings) % 1;
      const r = phase * 200;
      const a = (1 - phase) * 0.15;
      ctx.strokeStyle = `rgba(16,185,129,${a})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.stroke();
    }

    // Core glow
    const glowGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, 40);
    glowGrad.addColorStop(0, 'rgba(16,185,129,0.15)');
    glowGrad.addColorStop(1, 'rgba(16,185,129,0)');
    ctx.fillStyle = glowGrad;
    ctx.beginPath();
    ctx.arc(0, 0, 40, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function renderGeneric(ctx, p, w, h, t, accent) {
    // Simple geometric pattern for remaining projects
    const cx = w / 2, cy = h / 2;
    const opacity = Math.min(1, p * 2);
    const scale = 0.5 + p * 0.5;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.globalAlpha = opacity * 0.4;

    // Hexagonal grid
    const hexSize = 24 * scale;
    const hexW = hexSize * Math.sqrt(3);
    const hexH = hexSize * 1.5;

    for (let row = -3; row <= 3; row++) {
      for (let col = -3; col <= 3; col++) {
        const x = col * hexW + (row % 2) * hexW / 2;
        const y = row * hexH;
        const dist = Math.sqrt(x * x + y * y);
        const fade = Math.max(0, 1 - dist / (hexSize * 5));
        if (fade > 0) {
          ctx.strokeStyle = `rgba(${hexToRgb(accent)},${fade * 0.1})`;
          ctx.lineWidth = 1;
          drawHex(ctx, x, y, hexSize);
        }
      }
    }

    ctx.restore();
  }

  function renderFinale(ctx, p, w, h, t, accent) {
    // Particle convergence — particles fly toward center
    const cx = w / 2, cy = h / 2;
    const opacity = Math.min(1, p * 1.5);

    // Background gradient
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, w * 0.5);
    grad.addColorStop(0, 'rgba(16,185,129,0.06)');
    grad.addColorStop(1, 'rgba(8,8,8,0)');
    ctx.fillStyle = grad;
    ctx.globalAlpha = opacity;
    ctx.fillRect(0, 0, w, h);

    // Converging particles
    ctx.save();
    ctx.translate(cx, cy);
    for (let i = 0; i < 40; i++) {
      const angle = (i / 40) * Math.PI * 2 + t * 0.2;
      const dist = 200 * (1 - p) + Math.sin(t + i) * 20;
      const x = Math.cos(angle) * dist;
      const y = Math.sin(angle) * dist;
      const size = 1 + (1 - p) * 2;
      const a = 0.3 + (1 - p) * 0.4;
      ctx.fillStyle = `rgba(16,185,129,${a * opacity})`;
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.fill();

      // Trail
      ctx.strokeStyle = `rgba(16,185,129,${a * 0.1 * opacity})`;
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x * 0.3, y * 0.3);
      ctx.stroke();
    }

    // Central glow
    const glowGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, 60 + p * 40);
    glowGrad.addColorStop(0, `rgba(16,185,129,${0.2 * opacity})`);
    glowGrad.addColorStop(1, 'rgba(16,185,129,0)');
    ctx.fillStyle = glowGrad;
    ctx.beginPath();
    ctx.arc(0, 0, 60 + p * 40, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  // --- HELPERS ---
  function drawHex(ctx, x, y, size) {
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2;
      const px = x + Math.cos(a) * size;
      const py = y + Math.sin(a) * size;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.stroke();
  }

  function hexToRgb(hex) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return `${r},${g},${b}`;
  }

  // --- SCROLL HANDLER ---
  let scrollRAF = null;
  function onScroll() {
    scrollY = window.scrollY || window.pageYOffset;
    if (scrollRAF) return;
    scrollRAF = requestAnimationFrame(() => {
      scrollRAF = null;
    });
  }

  // --- INIT ---
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', resize);
  resize();
  initParticles();
  render();

})();
</script>
