<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Jesse — Builder</title>
<meta name="description" content="Scroll to explore.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0a0a0a;
  --text: #ededed;
  --text-muted: #525252;
  --text-dim: #2a2a2a;
  --accent: #10b981;
  --font-sans: 'Geist', system-ui, sans-serif;
  --font-mono: 'Geist Mono', monospace;
}
html, body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* WebGL canvas — fixed, full screen */
#gl-canvas {
  position: fixed;
  top: 0; left: 0;
  width: 100vw;
  height: 100vh;
  z-index: 0;
  pointer-events: none;
}

/* 2D overlay canvas for project visuals */
#overlay-canvas {
  position: fixed;
  top: 0; left: 0;
  width: 100vw;
  height: 100vh;
  z-index: 1;
  pointer-events: none;
}

/* Text layer */
#text-layer {
  position: fixed;
  top: 0; left: 0;
  width: 100vw;
  height: 100vh;
  z-index: 2;
  pointer-events: none;
}

.scene-text {
  position: absolute;
  opacity: 0;
  transition: opacity 0.6s ease, transform 0.6s ease;
  transform: translateY(20px);
  pointer-events: auto;
}
.scene-text.visible {
  opacity: 1;
  transform: translateY(0);
}

/* Hero text — centered, minimal */
.scene-hero {
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) translateY(20px);
  text-align: center;
}
.scene-hero.visible {
  transform: translate(-50%, -50%) translateY(0);
}
.scene-hero h1 {
  font-size: clamp(28px, 4vw, 48px);
  font-weight: 500;
  letter-spacing: -0.04em;
  line-height: 1.1;
  margin-bottom: 12px;
}
.scene-hero h1 .dim { color: var(--text-muted); }
.scene-hero p {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 0.15em;
  text-transform: uppercase;
}

/* Project text — bottom left, minimal */
.scene-project {
  bottom: 15vh;
  left: 6vw;
  max-width: 420px;
}
.scene-project .label {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  margin-bottom: 12px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.scene-project .label::before {
  content: '';
  width: 6px; height: 6px;
  border-radius: 50%;
  background: currentColor;
}
.scene-project h2 {
  font-size: clamp(24px, 3vw, 36px);
  font-weight: 500;
  letter-spacing: -0.03em;
  line-height: 1.1;
  margin-bottom: 8px;
}
.scene-project .desc {
  font-size: 14px;
  color: var(--text-muted);
  line-height: 1.5;
  margin-bottom: 16px;
}
.scene-project .links {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.scene-project .links a {
  font-size: 12px;
  color: var(--text-muted);
  text-decoration: none;
  padding: 6px 14px;
  border: 1px solid #1f1f1f;
  border-radius: 4px;
  transition: all 0.2s;
}
.scene-project .links a:hover {
  color: var(--text);
  border-color: #333;
}

/* Finale text — centered */
.scene-finale {
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) translateY(20px);
  text-align: center;
}
.scene-finale.visible {
  transform: translate(-50%, -50%) translateY(0);
}
.scene-finale h2 {
  font-size: clamp(24px, 3.5vw, 40px);
  font-weight: 500;
  letter-spacing: -0.04em;
  margin-bottom: 12px;
}
.scene-finale p {
  font-size: 14px;
  color: var(--text-muted);
  margin-bottom: 24px;
}
.scene-finale .links {
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
}
.scene-finale .links a {
  font-size: 13px;
  color: var(--text);
  text-decoration: none;
  padding: 10px 20px;
  border: 1px solid #1f1f1f;
  border-radius: 6px;
  transition: all 0.2s;
}
.scene-finale .links a:hover {
  border-color: #333;
  background: #111;
}
.scene-finale .links a.primary {
  background: var(--text);
  color: var(--bg);
  border-color: var(--text);
}

/* Top bar */
#topbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 32px;
  pointer-events: auto;
}
#topbar .brand {
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 8px;
}
#topbar .brand .dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--accent);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.8); }
}
#topbar .nav-links {
  display: flex;
  gap: 20px;
}
#topbar .nav-links a {
  font-size: 12px;
  color: var(--text-muted);
  text-decoration: none;
  transition: color 0.15s;
}
#topbar .nav-links a:hover { color: var(--text); }

/* Scroll hint */
#scroll-hint {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 5;
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--text-dim);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  opacity: 1;
  transition: opacity 0.5s;
  pointer-events: none;
}
#scroll-hint.hidden { opacity: 0; }
#scroll-hint .line {
  width: 1px;
  height: 20px;
  background: linear-gradient(to bottom, var(--text-dim), transparent);
  animation: line-pulse 2s ease-in-out infinite;
}
@keyframes line-pulse {
  0%, 100% { opacity: 0.3; transform: scaleY(1); }
  50% { opacity: 1; transform: scaleY(1.3); }
}

/* Route dots */
#route-dots {
  position: fixed;
  right: 20px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 5;
  display: flex;
  flex-direction: column;
  gap: 10px;
  pointer-events: auto;
}
.route-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  border: 1px solid #1f1f1f;
  background: transparent;
  cursor: pointer;
  transition: all 0.3s;
  position: relative;
  padding: 0;
}
.route-dot.active {
  background: var(--accent);
  border-color: var(--accent);
  box-shadow: 0 0 6px rgba(16,185,129,0.5);
}
.route-dot .label {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  font-family: var(--font-mono);
  font-size: 8px;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.2s;
  pointer-events: none;
}
.route-dot:hover { border-color: var(--text-muted); }
.route-dot:hover .label { opacity: 1; }

/* Scroll spacer */
#spacer {
  width: 1px;
  position: relative;
  z-index: -1;
}

@media (max-width: 768px) {
  #topbar { padding: 14px 20px; }
  #topbar .nav-links { display: none; }
  .scene-project { left: 6vw; bottom: 12vh; max-width: 300px; }
  .route-dot .label { display: none; }
  #route-dots { right: 12px; }
}
</style>
</head>
<body>

<div id="topbar">
  <a href="#" class="brand"><span class="dot"></span>Jesse Harrick</a>
  <div class="nav-links">
    <a href="https://github.com/GenJess">GitHub</a>
    <a href="https://generativejesse.com">Portfolio</a>
    <a href="https://github.com/jGPT-Automated/repo-atlas">Atlas</a>
  </div>
</div>

<canvas id="gl-canvas"></canvas>
<canvas id="overlay-canvas"></canvas>
<div id="text-layer"></div>
<div id="route-dots"></div>
<div id="scroll-hint"><span>scroll</span><div class="line"></div></div>
<div id="spacer"></div>

<script>
// ============================================
// THINKING ORB — WebGL scroll-scrubbed experience
// One orb that morphs through project states as you scroll
// ============================================

(function() {
'use strict';

// --- SCENES ---
// Each scene: orb color, orb behavior, project overlay visual, text
const SCENES = [
  {
    label: 'Intro',
    orbColor: [0.063, 0.725, 0.502],  // emerald
    orbState: 'calm',
    text: { type: 'hero', title: 'Jesse builds\nthings that ship.', subtitle: 'Scroll to explore' },
  },
  {
    label: 'LocalCheck',
    orbColor: [0.976, 0.451, 0.086],  // amber #f97316
    orbState: 'active',
    overlay: 'localcheck',
    text: {
      type: 'project',
      label: 'Sports · Mobile',
      title: 'LocalCheck',
      desc: 'Find active courts. Check in. Play. Rank up. 5,700+ courts mapped. Shipping to App Store.',
      links: [
        { label: 'GitHub', href: 'https://github.com/agenticjess-star/LocalCheck_Expo' },
        { label: 'Live', href: 'https://localcheck.lovable.app' },
        { label: 'Details', href: 'projects/localcheck.html' },
      ],
    },
  },
  {
    label: 'TEAIMS',
    orbColor: [0.506, 0.549, 0.973],  // indigo #818cf8
    orbState: 'thinking',
    overlay: 'teaims',
    text: {
      type: 'project',
      label: 'AI / Agents',
      title: 'TEAIMS',
      desc: '9 agents. Adversarial debates. Human-in-the-loop judgement. Persistent context across sessions.',
      links: [
        { label: 'GitHub', href: 'https://github.com/GenJess/TEAIMS' },
        { label: 'Details', href: 'projects/teaims.html' },
      ],
    },
  },
  {
    label: 'OmniVital',
    orbColor: [0.063, 0.725, 0.502],  // emerald
    orbState: 'shaping',
    overlay: 'omnivital',
    text: {
      type: 'project',
      label: 'Health Tech',
      title: 'OmniVital',
      desc: 'Voice-first AI consultant. 6 precision formulas. Biometric tracking. Privacy-first community.',
      links: [
        { label: 'GitHub', href: 'https://github.com/GenJess/omnivital-v3' },
        { label: 'Live', href: 'https://omnivital.lovable.app' },
        { label: 'Details', href: 'projects/omnivital.html' },
      ],
    },
  },
  {
    label: 'Alpha-Gauge',
    orbColor: [0.055, 0.647, 0.914],  // sky #0ea5e9
    orbState: 'solving',
    overlay: 'alphagauge',
    text: {
      type: 'project',
      label: 'Fintech',
      title: 'Alpha-Gauge',
      desc: 'Real-time Polymarket dashboard. Particle filter probability models. Monte Carlo analysis.',
      links: [
        { label: 'GitHub', href: 'https://github.com/agenticjess-star/alpha-gauge' },
        { label: 'Details', href: 'projects/alpha-gauge.html' },
      ],
    },
  },
  {
    label: 'Contact',
    orbColor: [0.063, 0.725, 0.502],
    orbState: 'converge',
    text: {
      type: 'finale',
      title: 'Let\'s build\nsomething real.',
      desc: 'Open to roles, contract work, founding engineer positions.',
      links: [
        { label: 'Email', href: 'mailto:Generative.jesse@gmail.com', primary: true },
        { label: 'GitHub', href: 'https://github.com/GenJess' },
        { label: 'Portfolio', href: 'https://generativejesse.com' },
      ],
    },
  },
];

const SCENE_SCROLL = 1.5;  // viewport heights per scene

// --- WEBGL ORB SHADER ---
const vertSrc = `
attribute vec2 a_pos;
void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }
`;

const fragSrc = `
precision highp float;
uniform vec2 u_res;
uniform float u_time;
uniform vec3 u_color;
uniform float u_progress;     // 0-1 scroll progress within scene
uniform float u_globalProgress; // 0-1 total scroll progress
uniform int u_state;            // 0=calm, 1=active, 2=thinking, 3=shaping, 4=solving, 5=converge
uniform float u_orbSize;

// Simple noise
float hash(vec2 p) {
  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

float noise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),
             mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
}

float fbm(vec2 p) {
  float v = 0.0;
  float a = 0.5;
  for (int i = 0; i < 5; i++) {
    v += a * noise(p);
    p *= 2.0;
    a *= 0.5;
  }
  return v;
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * u_res) / min(u_res.x, u_res.y);
  float t = u_time;
  
  // Orb center
  float r = length(uv);
  float orbR = u_orbSize;
  
  // State-specific distortion
  float distortion = 0.0;
  if (u_state == 0) {
    // Calm — slow breathing
    distortion = sin(r * 8.0 - t * 0.5) * 0.015;
  } else if (u_state == 1) {
    // Active — pulsing energy
    distortion = sin(r * 12.0 - t * 2.0) * 0.025 + sin(uv.x * 3.0 + t) * 0.01;
  } else if (u_state == 2) {
    // Thinking — ripples
    distortion = sin(r * 6.0 - t * 1.5) * 0.02 + fbm(uv * 3.0 + t * 0.1) * 0.015;
  } else if (u_state == 3) {
    // Shaping — flowing
    distortion = fbm(uv * 4.0 + vec2(t * 0.2, 0.0)) * 0.03;
  } else if (u_state == 4) {
    // Solving — sharp pulses
    distortion = sin(atan(uv.y, uv.x) * 5.0 + t * 3.0) * 0.02 + sin(r * 10.0 - t * 2.5) * 0.015;
  } else {
    // Converge — pulling inward
    distortion = sin(r * 5.0 + t) * 0.01 * (1.0 - u_progress);
  }
  
  orbR += distortion;
  
  // Orb body
  float orb = smoothstep(orbR + 0.005, orbR - 0.005, r);
  
  // Glow
  float glow = smoothstep(orbR + 0.3, orbR, r) * 0.4;
  glow *= glow;
  
  // Internal texture
  float n = fbm(uv * 4.0 + vec2(t * 0.15, t * 0.1));
  float n2 = fbm(uv * 8.0 - vec2(t * 0.2, 0.0));
  float internal = n * 0.5 + n2 * 0.3;
  
  // Color mixing
  vec3 col = u_color;
  vec3 hotSpot = u_color + vec3(0.3);
  vec3 darkSpot = u_color * 0.3;
  
  vec3 orbCol = mix(darkSpot, hotSpot, internal);
  orbCol += u_color * glow * 1.5;
  
  // Rim light
  float rim = smoothstep(orbR - 0.02, orbR, r) * smoothstep(orbR + 0.04, orbR, r);
  orbCol += vec3(1.0) * rim * 0.3;
  
  // Outer glow
  vec3 outerGlow = u_color * glow * 0.15;
  
  // Background — subtle gradient
  float bgGrad = 1.0 - length(uv) * 0.5;
  vec3 bg = vec3(0.039, 0.039, 0.039) * bgGrad;
  
  // Combine
  vec3 final = mix(bg, orbCol, orb);
  final += outerGlow;
  
  // State rings (thinking/shaping states)
  if (u_state == 2 || u_state == 3) {
    for (int i = 1; i <= 3; i++) {
      float ringR = orbR + 0.06 * float(i) + sin(t * float(i) * 0.5) * 0.01;
      float ring = smoothstep(ringR + 0.003, ringR - 0.003, r) * smoothstep(ringR - 0.003, ringR + 0.003, r);
      final += u_color * ring * 0.08;
    }
  }
  
  // Active state — energy particles
  if (u_state == 1) {
    for (int i = 0; i < 8; i++) {
      float fi = float(i);
      float angle = fi * 0.785 + t * 0.3;
      float pr = orbR + 0.04 + sin(t * 2.0 + fi) * 0.02;
      vec2 ppos = vec2(cos(angle), sin(angle)) * pr;
      float pd = length(uv - ppos);
      final += u_color * smoothstep(0.008, 0.0, pd) * 0.5;
    }
  }
  
  // Solving state — data lines
  if (u_state == 4) {
    float lines = step(0.98, sin(uv.y * 30.0 + t * 5.0));
    float mask = smoothstep(orbR + 0.1, orbR - 0.1, r);
    final += u_color * lines * mask * 0.06;
  }
  
  gl_FragColor = vec4(final, 1.0);
}
`;

// --- INIT WEBGL ---
const glCanvas = document.getElementById('gl-canvas');
const gl = glCanvas.getContext('webgl') || glCanvas.getContext('experimental-webgl');
const overlayCanvas = document.getElementById('overlay-canvas');
const octx = overlayCanvas.getContext('2d');

let W, H, dpr;
let scrollY = 0, maxScroll = 0;
let time = 0;

// Compile shader
function compileShader(src, type) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error('Shader error:', gl.getShaderInfoLog(s));
  }
  return s;
}

const vs = compileShader(vertSrc, gl.VERTEX_SHADER);
const fs = compileShader(fragSrc, gl.FRAGMENT_SHADER);
const prog = gl.createProgram();
gl.attachShader(prog, vs);
gl.attachShader(prog, fs);
gl.linkProgram(prog);
gl.useProgram(prog);

// Fullscreen quad
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const posLoc = gl.getAttribLocation(prog, 'a_pos');
gl.enableVertexAttribArray(posLoc);
gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

const uRes = gl.getUniformLocation(prog, 'u_res');
const uTime = gl.getUniformLocation(prog, 'u_time');
const uColor = gl.getUniformLocation(prog, 'u_color');
const uProgress = gl.getUniformLocation(prog, 'u_progress');
const uGlobalProgress = gl.getUniformLocation(prog, 'u_globalProgress');
const uState = gl.getUniformLocation(prog, 'u_state');
const uOrbSize = gl.getUniformLocation(prog, 'u_orbSize');

// --- BUILD TEXT ---
const textLayer = document.getElementById('text-layer');
const textEls = [];

SCENES.forEach((scene, i) => {
  const el = document.createElement('div');
  el.className = 'scene-text ' + (scene.text.type === 'hero' ? 'scene-hero' : scene.text.type === 'finale' ? 'scene-finale' : 'scene-project');
  
  if (scene.text.type === 'hero') {
    el.innerHTML = `
      <h1>${scene.text.title.replace(/\n/g, '<br>')}</h1>
      <p>${scene.text.subtitle}</p>
    `;
  } else if (scene.text.type === 'project') {
    const c = `rgb(${Math.round(scene.orbColor[0]*255)},${Math.round(scene.orbColor[1]*255)},${Math.round(scene.orbColor[2]*255)})`;
    el.innerHTML = `
      <div class="label" style="color:${c}">${scene.text.label}</div>
      <h2>${scene.text.title}</h2>
      <div class="desc">${scene.text.desc}</div>
      <div class="links">${scene.text.links.map(l => `<a href="${l.href}" target="_blank">${l.label}</a>`).join('')}</div>
    `;
  } else if (scene.text.type === 'finale') {
    el.innerHTML = `
      <h2>${scene.text.title.replace(/\n/g, '<br>')}</h2>
      <p>${scene.text.desc}</p>
      <div class="links">${scene.text.links.map(l => `<a href="${l.href}" ${l.primary ? 'class="primary"' : ''}>${l.label}</a>`).join('')}</div>
    `;
  }
  textLayer.appendChild(el);
  textEls.push(el);
});

// --- BUILD ROUTE DOTS ---
const routeDots = document.getElementById('route-dots');
SCENES.forEach((scene, i) => {
  const dot = document.createElement('button');
  dot.className = 'route-dot';
  dot.innerHTML = `<span class="label">${scene.label}</span>`;
  dot.addEventListener('click', () => {
    window.scrollTo({ top: i * SCENE_SCROLL * H, behavior: 'smooth' });
  });
  routeDots.appendChild(dot);
});
const dotEls = routeDots.querySelectorAll('.route-dot');

// --- RESIZE ---
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  
  [glCanvas, overlayCanvas].forEach(c => {
    c.width = W * dpr;
    c.height = H * dpr;
    c.style.width = W + 'px';
    c.style.height = H + 'px';
  });
  
  gl.viewport(0, 0, glCanvas.width, glCanvas.height);
  octx.setTransform(dpr, 0, 0, dpr, 0, 0);
  
  const totalH = SCENES.length * SCENE_SCROLL * H;
  document.getElementById('spacer').style.height = totalH + 'px';
  maxScroll = totalH - H;
}

// --- SCROLL MATH ---
function getScrollState() {
  const sceneH = SCENE_SCROLL * H;
  const scene = Math.min(Math.floor(scrollY / sceneH), SCENES.length - 1);
  const start = scene * sceneH;
  const progress = Math.max(0, Math.min(1, (scrollY - start) / sceneH));
  const global = maxScroll > 0 ? scrollY / maxScroll : 0;
  return { scene, progress, global };
}

// Smooth interpolation
function lerp(a, b, t) { return a + (b - a) * t; }
function lerpColor(c1, c2, t) {
  return [lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)];
}
function smoothstep(t) { t = Math.max(0, Math.min(1, t)); return t * t * (3 - 2 * t); }

// --- RENDER ---
function render() {
  time += 0.016;
  const { scene, progress, global } = getScrollState();
  
  // --- WebGL orb ---
  // Interpolate color between current and next scene during transition
  let orbColor = SCENES[scene].orbColor;
  let orbSize = 0.22;
  let orbState = SCENES[scene].orbState;
  let stateNum = 0;
  
  const stateMap = { calm: 0, active: 1, thinking: 2, shaping: 3, solving: 4, converge: 5 };
  stateNum = stateMap[orbState] || 0;
  
  // Size animation per scene
  if (orbState === 'calm') orbSize = 0.20 + Math.sin(time * 0.3) * 0.005;
  else if (orbState === 'active') orbSize = 0.24 + Math.sin(time * 1.0) * 0.01;
  else if (orbState === 'thinking') orbSize = 0.22 + Math.sin(time * 0.5) * 0.008;
  else if (orbState === 'shaping') orbSize = 0.23;
  else if (orbState === 'solving') orbSize = 0.22 + Math.sin(time * 2.0) * 0.012;
  else if (orbState === 'converge') orbSize = 0.15 + progress * 0.05;
  
  // Crossfade color at scene transitions
  const transitionStart = 0.85;
  if (progress > transitionStart && scene < SCENES.length - 1) {
    const t = smoothstep((progress - transitionStart) / (1 - transitionStart));
    orbColor = lerpColor(SCENES[scene].orbColor, SCENES[scene + 1].orbColor, t);
  }
  
  // Render orb
  gl.uniform2f(uRes, glCanvas.width, glCanvas.height);
  gl.uniform1f(uTime, time);
  gl.uniform3f(uColor, orbColor[0], orbColor[1], orbColor[2]);
  gl.uniform1f(uProgress, progress);
  gl.uniform1f(uGlobalProgress, global);
  gl.uniform1i(uState, stateNum);
  gl.uniform1f(uOrbSize, orbSize);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  
  // --- 2D overlay ---
  octx.clearRect(0, 0, W, H);
  const overlayOpacity = smoothstep(progress * 1.5) * smoothstep((1 - progress) * 2);
  
  if (SCENES[scene].overlay && overlayOpacity > 0.01) {
    octx.globalAlpha = overlayOpacity * 0.5;
    renderOverlay(SCENES[scene].overlay, progress, orbColor);
    octx.globalAlpha = 1;
  }
  
  // --- Text visibility ---
  textEls.forEach((el, i) => {
    const sceneStart = i * SCENE_SCROLL * H;
    const sceneMid = sceneStart + SCENE_SCROLL * H * 0.4;
    const dist = Math.abs(scrollY - sceneMid);
    const range = SCENE_SCROLL * H * 0.35;
    el.classList.toggle('visible', dist < range);
  });
  
  // --- Route dots ---
  dotEls.forEach((d, i) => d.classList.toggle('active', i === scene));
  
  // --- Scroll hint ---
  document.getElementById('scroll-hint').classList.toggle('hidden', scrollY > 50);
  
  requestAnimationFrame(render);
}

// --- OVERLAY RENDERERS (project-specific visuals around the orb) ---
function renderOverlay(type, progress, color) {
  const cx = W / 2, cy = H / 2;
  const orbR = Math.min(W, H) * 0.22;
  const c = `rgba(${Math.round(color[0]*255)},${Math.round(color[1]*255)},${Math.round(color[2]*255)},`;
  
  if (type === 'localcheck') {
    // Court grid around orb
    const cellSize = 36;
    const gridR = orbR + 60;
    for (let i = -4; i <= 4; i++) {
      for (let j = -4; j <= 4; j++) {
        const x = cx + i * cellSize;
        const y = cy + j * cellSize;
        const dist = Math.sqrt(i*i + j*j) * cellSize;
        if (dist > gridR || dist < orbR - 10) continue;
        const fade = 1 - Math.max(0, (dist - orbR) / (gridR - orbR));
        const active = (i + j + Math.floor(time * 0.8)) % 3 === 0;
        if (active) {
          octx.strokeStyle = c + (0.12 * fade) + ')';
          octx.lineWidth = 1;
          octx.strokeRect(x - cellSize/2, y - cellSize/2, cellSize - 2, cellSize - 2);
          const pulse = 0.5 + Math.sin(time * 2 + i + j) * 0.5;
          octx.fillStyle = c + (0.15 * fade * pulse) + ')';
          octx.beginPath();
          octx.arc(x, y, 2.5 * pulse, 0, Math.PI * 2);
          octx.fill();
        }
      }
    }
    // ELO number
    octx.fillStyle = c + '0.15)';
    octx.font = '700 14px Geist Mono, monospace';
    octx.textAlign = 'center';
    octx.fillText('1247', cx, cy - orbR - 24);
    octx.font = '500 8px Geist Mono, monospace';
    octx.fillStyle = c + '0.08)';
    octx.fillText('ELO', cx, cy - orbR - 10);
    
  } else if (type === 'teaims') {
    // Agent nodes orbiting
    const agents = ['IDEA', 'ARCH', 'DESIGN', 'SEC', 'GROW', 'LEGAL', 'DATA', 'OPS', 'QA'];
    const orbitR = orbR + 50;
    agents.forEach((label, i) => {
      const a = (i / agents.length) * Math.PI * 2 + time * 0.08;
      const x = cx + Math.cos(a) * orbitR;
      const y = cy + Math.sin(a) * orbitR;
      // Connection line
      octx.strokeStyle = c + '0.04)';
      octx.lineWidth = 0.5;
      octx.beginPath();
      octx.moveTo(cx, cy);
      octx.lineTo(x, y);
      octx.stroke();
      // Node
      octx.fillStyle = '#111';
      octx.strokeStyle = c + '0.1)';
      octx.lineWidth = 1;
      octx.beginPath();
      octx.arc(x, y, 14, 0, Math.PI * 2);
      octx.fill();
      octx.stroke();
      // Label
      octx.fillStyle = c + '0.2)';
      octx.font = '500 6px Geist Mono, monospace';
      octx.textAlign = 'center';
      octx.fillText(label, x, y + 2);
    });
    
  } else if (type === 'omnivital') {
    // Vitality rings expanding from orb
    for (let i = 0; i < 4; i++) {
      const phase = (time * 0.3 + i / 4) % 1;
      const r = orbR + phase * 100;
      const a = (1 - phase) * 0.06;
      octx.strokeStyle = c + a + ')';
      octx.lineWidth = 1.5;
      octx.beginPath();
      octx.arc(cx, cy, r, 0, Math.PI * 2);
      octx.stroke();
    }
    // Pulsing inner ring
    const pulseR = orbR + 8 + Math.sin(time * 1.5) * 3;
    octx.strokeStyle = c + '0.1)';
    octx.lineWidth = 2;
    octx.beginPath();
    octx.arc(cx, cy, pulseR, 0, Math.PI * 2);
    octx.stroke();
    // Vitality score
    octx.fillStyle = c + '0.12)';
    octx.font = '500 10px Geist Mono, monospace';
    octx.textAlign = 'center';
    octx.fillText('92', cx, cy + orbR + 28);
    octx.font = '400 7px Geist Mono, monospace';
    octx.fillStyle = c + '0.06)';
    octx.fillText('VITALITY', cx, cy + orbR + 42);
    
  } else if (type === 'alphagauge') {
    // Price bars below orb
    const bars = [
      { label: 'BTC', up: true, val: '62.4k' },
      { label: 'ETH', up: false, val: '3.1k' },
      { label: 'SOL', up: true, val: '142' },
      { label: '5m',  up: true, val: 'UP' },
    ];
    const barW = 80;
    const spacing = 18;
    const startY = cy + orbR + 30;
    const totalW = bars.length * barW;
    const startX = cx - totalW / 2;
    
    bars.forEach((bar, i) => {
      const x = startX + i * barW;
      const y = startY;
      const fill = 0.4 + Math.sin(time * 0.5 + i * 1.2) * 0.2 + 0.2;
      // Bar track
      octx.fillStyle = 'rgba(30,30,30,0.5)';
      octx.fillRect(x, y, barW - 8, 3);
      // Bar fill
      octx.fillStyle = bar.up ? 'rgba(16,185,129,0.15)' : 'rgba(244,63,94,0.15)';
      octx.fillRect(x, y, (barW - 8) * fill, 3);
      // Label
      octx.fillStyle = 'rgba(80,80,80,0.4)';
      octx.font = '500 8px Geist Mono, monospace';
      octx.textAlign = 'left';
      octx.fillText(bar.label, x, y - 4);
      // Value
      octx.fillStyle = bar.up ? 'rgba(16,185,129,0.2)' : 'rgba(244,63,94,0.2)';
      octx.font = '500 7px Geist Mono, monospace';
      octx.fillText(bar.val, x + barW - 24, y - 4);
    });
  }
}

// --- SCROLL ---
window.addEventListener('scroll', () => { scrollY = window.scrollY; }, { passive: true });
window.addEventListener('resize', resize);

// --- INIT ---
resize();
render();

})();
</script>
